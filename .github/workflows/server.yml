# サーバー（apps/server・Cloudflare Workers）のデプロイ。
# - main への push：本番（api.builder.ds2.uk）。D1 のマイグレーションを当ててから wrangler deploy する。
# - 手動実行（Run workflow）：ステージング（api-staging.builder.ds2.uk と、画面の staging.builder.ds2.uk）。
#   ブランチを選んで実行すれば、main に入れる前にステージングで試せる。
# 秘密情報（DISCORD_CLIENT_SECRET・SESSION_SECRET・GITHUB_APP_PRIVATE_KEY）は wrangler secret put で Workers に登録済みのものを使い、
# ここでは扱わない。ステージングは発議・採決を模擬の OpsBot で行い、反映先は ds-craft/rules-staging（wrangler.jsonc）。
name: Server

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/core/**'
      - 'package-lock.json'
      - '.github/workflows/server.yml'
  workflow_dispatch:
    inputs:
      target:
        description: デプロイ先
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: server-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/server
      - run: npx vitest run --project server
      - run: npm run test:integration -w apps/server

  production:
    if: github.event_name == 'push' || github.event.inputs.target == 'production'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 未適用のマイグレーションだけが当たる。破壊的な変更も自動で本番に流れるので、migrations/ の変更は慎重に見る
      - run: npx wrangler d1 migrations apply DB --remote --env=""
      - run: npx wrangler deploy --env=""

  staging:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging'
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 migrations apply DB --remote --env staging
        working-directory: apps/server
      - run: npx wrangler deploy --env staging
        working-directory: apps/server
      # 画面もステージングのサーバーにつなぐ版を作り、staging.builder.ds2.uk に置く（Workers の静的配信）
      - run: npm run build -w apps/web
        env:
          VITE_API_ORIGIN: https://api-staging.builder.ds2.uk
          # 改正の元にするルールも、ステージングの反映先（ds-craft/rules-staging）から読む
          VITE_RULES_REPO: ds-craft/rules-staging
      - run: npx wrangler deploy -c wrangler.staging.jsonc
        working-directory: apps/web
